name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unstable SemVer without v prefix (for example 0.1.0-rc.1)
        required: true
        type: string
      ref:
        description: Commit or ref already reachable from main
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Require an unstable version and a main commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^0\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rebuild and test
        run: |
          npm --prefix web ci
          npm --prefix web test
          npm --prefix web run build
          node scripts/verify-console.cjs
          git diff --exit-code -- web/src/api/schema.d.ts internal/consoleui/dist
          test -z "$(gofmt -l .)"
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go test -race ./...
          node scripts/validate-docs.cjs
          node scripts/verify-egress.cjs
          bash -n scripts/install-linux.sh
          bash -n scripts/bootstrap-linux.sh
          bash -n scripts/uninstall-linux.sh
          bash -n scripts/package-release.sh
          bash -n scripts/verify-release-package.sh
          bash -n scripts/verify-package-upgrade-linux.sh
          node scripts/verify-installation.cjs
          node scripts/verify-publication.cjs
          node docs/contratos/storage/schema-v1.contract.test.cjs
          node docs/contratos/storage/admin-identity-v1.contract.test.cjs
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build deterministic candidate archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash scripts/package-release.sh "$VERSION" dist/release
          commit="$(git rev-parse HEAD)"
          for arch in amd64 arm64; do
            bash scripts/verify-release-package.sh \
              "dist/release/modelcairn_${VERSION}_linux_${arch}.tar.gz" \
              dist/release/SHA256SUMS "$VERSION" "$commit" "$arch"
          done
          bash scripts/verify-release-package-failures.sh dist/release "$VERSION" "$commit"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/release/modelcairn_${{ inputs.version }}.spdx.json
          upload-artifact: false
      - name: Bind SBOM checksum to the candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd dist/release
          sha256sum --binary "modelcairn_${VERSION}.spdx.json" >> SHA256SUMS
      - name: Attest candidate archives
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.spdx.json
      - name: Upload private candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modelcairn-${{ inputs.version }}-candidate
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
