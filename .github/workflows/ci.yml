name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify embedded web console
        run: |
          npm --prefix web ci
          npm --prefix web test
          npm --prefix web run build
          node scripts/verify-console.cjs
          git diff --exit-code -- web/src/api/schema.d.ts internal/consoleui/dist
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Validate documentation contracts
        run: |
          node scripts/validate-docs.cjs
          node scripts/verify-egress.cjs
          bash -n scripts/install-linux.sh
          bash -n scripts/bootstrap-linux.sh
          bash -n scripts/uninstall-linux.sh
          bash -n scripts/package-release.sh
          bash -n scripts/verify-release-package.sh
          node scripts/verify-installation.cjs
          node docs/contratos/storage/schema-v1.contract.test.cjs
          node docs/contratos/storage/admin-identity-v1.contract.test.cjs
      - name: Benchmark smoke test
        run: go test -run '^$' -bench '^BenchmarkHealthz$' -benchtime=100x ./internal/httpserver
      - name: Streaming router concurrency smoke test
        run: go test -run '^$' -bench '^BenchmarkStreamingRouterConcurrency$' -benchtime=1x ./internal/router
      - name: Empty-server resource budget smoke test
        env:
          DURATION_SECONDS: "10"
          SAMPLE_INTERVAL_SECONDS: "1"
          MAX_RSS_KIB: "131072"
          OUTPUT_FILE: /tmp/modelcairn-benchmark.md
        run: bash scripts/benchmark-idle.sh
      - name: Milestone 2 product integration gate
        env:
          DURATION_SECONDS: "5"
          SAMPLE_INTERVAL_SECONDS: "1"
          MAX_RSS_KIB: "131072"
          MAX_DATA_BYTES: "16777216"
          OUTPUT_FILE: /tmp/modelcairn-hito2.md
        run: bash scripts/verify-hito2.sh
      - name: Milestone 3 administrative integration gate
        env:
          MAX_RSS_KIB: "131072"
        run: bash scripts/verify-hito3.sh
      - name: Milestone 4 streaming integration gate
        env:
          MAX_RSS_KIB: "131072"
          OUTPUT_FILE: /tmp/modelcairn-hito4.md
        run: bash scripts/verify-hito4.sh
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify deterministic release packages
        run: |
          version="0.0.0-ci"
          commit="$(git rev-parse HEAD)"
          bash scripts/package-release.sh "$version" dist/release-ci
          for arch in amd64 arm64; do
            bash scripts/verify-release-package.sh \
              "dist/release-ci/modelcairn_${version}_linux_${arch}.tar.gz" \
              dist/release-ci/SHA256SUMS "$version" "$commit" "$arch"
          done
          cp dist/release-ci/SHA256SUMS /tmp/modelcairn-first-build.SHA256SUMS
          bash scripts/package-release.sh "$version" dist/release-ci
          cmp /tmp/modelcairn-first-build.SHA256SUMS dist/release-ci/SHA256SUMS

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux artifact
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "dist/modelcairn-linux-${GOARCH}" ./cmd/modelcairn
