name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Validate documentation contracts
        run: |
          node scripts/validate-docs.cjs
          node docs/contratos/storage/schema-v1.contract.test.cjs
          node docs/contratos/storage/admin-identity-v1.contract.test.cjs
      - name: Benchmark smoke test
        run: go test -run '^$' -bench '^BenchmarkHealthz$' -benchtime=100x ./internal/httpserver
      - name: Streaming router concurrency smoke test
        run: go test -run '^$' -bench '^BenchmarkStreamingRouterConcurrency$' -benchtime=1x ./internal/router
      - name: Empty-server resource budget smoke test
        env:
          DURATION_SECONDS: "10"
          SAMPLE_INTERVAL_SECONDS: "1"
          MAX_RSS_KIB: "131072"
          OUTPUT_FILE: /tmp/modelcairn-benchmark.md
        run: bash scripts/benchmark-idle.sh
      - name: Milestone 2 product integration gate
        env:
          DURATION_SECONDS: "5"
          SAMPLE_INTERVAL_SECONDS: "1"
          MAX_RSS_KIB: "131072"
          MAX_DATA_BYTES: "16777216"
          OUTPUT_FILE: /tmp/modelcairn-hito2.md
        run: bash scripts/verify-hito2.sh
      - name: Milestone 3 administrative integration gate
        env:
          MAX_RSS_KIB: "131072"
        run: bash scripts/verify-hito3.sh
      - name: Milestone 4 streaming integration gate
        env:
          MAX_RSS_KIB: "131072"
          OUTPUT_FILE: /tmp/modelcairn-hito4.md
        run: bash scripts/verify-hito4.sh
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux artifact
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "dist/modelcairn-linux-${GOARCH}" ./cmd/modelcairn
