openapi: 3.1.0
info:
  title: ModelCairn Data API
  version: 1.0.0-alpha.1
  description: Strict Phase 1 Chat Completions subset; not a full compatibility claim.
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Route a text Chat Completions request
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatCompletionRequest'}
      responses:
        '200':
          description: Completion JSON or SSE when stream is true.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/ModelCairnError'}
        '401': {$ref: '#/components/responses/ModelCairnError'}
        '403': {$ref: '#/components/responses/ModelCairnError'}
        '413': {$ref: '#/components/responses/ModelCairnError'}
        '415': {$ref: '#/components/responses/ModelCairnError'}
        '422': {$ref: '#/components/responses/ModelCairnError'}
        '429': {$ref: '#/components/responses/ModelCairnError'}
        '502': {$ref: '#/components/responses/ModelCairnError'}
        '503': {$ref: '#/components/responses/ModelCairnError'}
        '504': {$ref: '#/components/responses/ModelCairnError'}
components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
      bearerFormat: ModelCairn AgentToken
  responses:
    ModelCairnError:
      description: Safe error envelope; no content or secrets.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:/-]+$'
          description: Logical route alias, not an upstream model ID.
        messages:
          type: array
          minItems: 1
          maxItems: 4096
          items: {$ref: '#/components/schemas/Message'}
        stream: {type: boolean, default: false}
        stream_options: {$ref: '#/components/schemas/StreamOptions'}
        tools:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/FunctionTool'}
        tool_choice:
          oneOf:
            - {type: string, enum: [none, auto, required]}
            - {$ref: '#/components/schemas/NamedToolChoice'}
        parallel_tool_calls: {type: boolean}
        temperature: {type: number, minimum: 0, maximum: 2}
        top_p: {type: number, minimum: 0, maximum: 1}
        max_tokens: {type: integer, minimum: 1}
        max_completion_tokens: {type: integer, minimum: 1}
    Message:
      oneOf:
        - {$ref: '#/components/schemas/TextMessage'}
        - {$ref: '#/components/schemas/AssistantMessage'}
        - {$ref: '#/components/schemas/ToolMessage'}
    TextMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: {type: string, enum: [system, developer, user]}
        content: {$ref: '#/components/schemas/TextContent'}
        name: {type: string, maxLength: 64}
    AssistantMessage:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {const: assistant}
        content:
          oneOf:
            - {$ref: '#/components/schemas/TextContent'}
            - {type: 'null'}
        name: {type: string, maxLength: 64}
        tool_calls:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ToolCall'}
      description: At least one of content or tool_calls must be present.
    ToolMessage:
      type: object
      additionalProperties: false
      required: [role, content, tool_call_id]
      properties:
        role: {const: tool}
        content: {$ref: '#/components/schemas/TextContent'}
        name: {type: string, maxLength: 64}
        tool_call_id: {type: string, minLength: 1, maxLength: 256}
    TextContent:
      oneOf:
        - {type: string}
        - type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [type, text]
            properties:
              type: {const: text}
              text: {type: string}
    FunctionTool:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type: {const: function}
        function:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 64
              pattern: '^[A-Za-z0-9_-]+$'
            description: {type: string, maxLength: 4096}
            parameters: {type: object}
            strict: {type: boolean}
    NamedToolChoice:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type: {const: function}
        function:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: {type: string}
    ToolCall:
      type: object
      additionalProperties: false
      required: [id, type, function]
      properties:
        id: {type: string, minLength: 1, maxLength: 256}
        type: {const: function}
        function:
          type: object
          additionalProperties: false
          required: [name, arguments]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 64
              pattern: '^[A-Za-z0-9_-]+$'
            arguments: {type: string}
    StreamOptions:
      type: object
      additionalProperties: false
      properties:
        include_usage: {type: boolean}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [message, type, code, request_id]
          properties:
            message: {type: string}
            type: {const: modelcairn_error}
            code: {type: string}
            param: {type: [string, 'null']}
            request_id: {type: string}
