<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ModelCairn · Wireframe de estructura</title>
  <style>
    :root{font:15px/1.45 system-ui,sans-serif;color:#1d252b;background:#f1f2f3}
    *{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.side{background:#fff;border-right:1px solid #c9cdd0;padding:18px 12px;display:flex;flex-direction:column;gap:20px}
    .brand{font-weight:800;padding:8px 12px}.nav{display:grid;gap:3px}.nav a{padding:9px 12px;border-radius:6px}.nav a.active{background:#dfe3e5;font-weight:700}.foot{margin-top:auto;font-size:12px;color:#576168;padding:8px 12px}
    main{min-width:0}.top{background:#fff;border-bottom:1px solid #c9cdd0;min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 28px;gap:12px}
    .body{max-width:1250px;margin:auto;padding:28px}.banner{border:1px dashed #66737a;background:#fff;padding:10px 14px;margin-bottom:24px;font-size:13px}
    .head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin:0 0 20px}h1{font-size:27px;margin:0 0 3px}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 7px}p{margin:0;color:#4a565d}.muted{font-size:13px;color:#5e6b72}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#fff;border:1px solid #c7cdd0;border-radius:8px;padding:18px;min-width:0}.card strong.big{display:block;font-size:27px;margin:7px 0}.card + .card{margin-top:0}.section{margin-top:25px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #d9dddf;padding:13px 0}.row:first-of-type{border-top:0}.row a{text-decoration:underline}.btn{background:#303c43;color:#fff;border:1px solid #303c43;border-radius:6px;padding:8px 13px;display:inline-block}.btn.light{color:#243037;background:#fff;border-color:#aab3b8}.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #697f8c;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px}.tabs{display:flex;gap:4px;border-bottom:1px solid #bfc6ca;margin:18px 0 20px;overflow-x:auto}.tabs a{padding:9px 14px;white-space:nowrap}.tabs a.active{border-bottom:3px solid #303c43;font-weight:700}.crumb{font-size:13px;color:#58656c;margin-bottom:11px}.crumb a{text-decoration:underline}.placeholder{border:1px dashed #a8b1b6;background:#fafafa;min-height:110px;display:grid;place-items:center;text-align:center;padding:15px;color:#657177}.form{display:grid;gap:13px;max-width:550px}.form label{display:grid;gap:5px;font-weight:600}.form input,.form select{min-height:38px;padding:8px;border:1px solid #a7b0b5;border-radius:5px;width:100%;background:#fff}.form .actions{padding-top:8px}.tag{font-size:11px;border:1px solid #b4bdc1;padding:3px 6px;border-radius:4px;color:#4e5a61}.stack{display:grid;gap:14px}.route-step{display:flex;gap:14px;align-items:center}.number{border:1px solid #9aa6ac;border-radius:50%;height:30px;width:30px;display:grid;place-items:center;flex:none}.filter{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.filter button{background:#fff;border:1px solid #aab3b8;border-radius:5px;padding:6px 10px}.filter button.active{background:#dfe3e5;font-weight:700}.note{background:#e8eaeb;padding:12px;border-radius:5px;margin-top:12px;font-size:13px;color:#3d4a51}.hidden{display:none}
    @media(max-width:850px){.app{display:block}.side{border-right:0;border-bottom:1px solid #c9cdd0;padding:8px 12px;gap:5px}.brand{padding:4px}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap}.foot{display:none}.top{padding:10px 16px}.body{padding:18px}.grid,.two{grid-template-columns:1fr}.head{flex-wrap:wrap}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand">◫ ModelCairn</div><nav class="nav" aria-label="Principal">
    <a href="#/inicio" data-nav="inicio">Inicio</a><a href="#/proveedores" data-nav="proveedores">Proveedores</a><a href="#/modelos" data-nav="modelos">Modelos</a><a href="#/rutas" data-nav="rutas">Rutas</a><a href="#/aplicaciones" data-nav="aplicaciones">Aplicaciones</a><a href="#/actividad" data-nav="actividad">Actividad</a><a href="#/datos" data-nav="datos">Datos</a><a href="#/configuracion" data-nav="configuracion">Configuración</a>
  </nav><div class="foot">Wireframe · solo estructura</div></aside>
  <main><header class="top"><span id="location">Inicio</span><span class="muted">Administrador ▾</span></header><div class="body"><div class="banner"><strong>WIREFRAME · DATOS DE EJEMPLO</strong> — No está conectado a la VM. Evalúa ubicación y recorrido; colores, gráficos y estilo final vendrán después.</div><div id="content"></div></div></main>
</div>
<script>
const screens={
  inicio:`<div class="head"><div><h1>Inicio</h1><p>Estado de ModelCairn y lo que requiere tu atención.</p></div></div><div class="grid"><article class="card"><span class="muted">Gateway</span><strong class="big">Operativo</strong><p>Listo para recibir solicitudes</p></article><article class="card"><span class="muted">Solicitudes · 24 h</span><strong class="big">1.284</strong><p>1.230 correctas · 54 fallidas</p></article><article class="card"><span class="muted">Tokens · 24 h</span><strong class="big">2,4 M</strong><p>Según conteos reportados</p></article></div><div class="grid two section"><article class="card"><h2>Tráfico reciente</h2><div class="placeholder">Gráfico propuesto: solicitudes y errores por hora</div><div class="note">Aquí se decidirá el gráfico después de validar los datos disponibles.</div></article><article class="card"><h2>Requiere atención</h2><div class="row"><span>1 proveedor sin modelos</span><a href="#/proveedores/demo/modelos">Revisar</a></div><div class="row"><span>Sin otros problemas detectados</span></div><p class="muted">Esta tarjeta desaparece si no hay pendientes.</p></article></div><div class="card section"><h2>Actividad reciente</h2>${eventRows(3)}<a href="#/actividad">Abrir registro completo →</a></div>`,
  proveedores:`<div class="head"><div><h1>Proveedores</h1><p>Servicios externos a los que ModelCairn envía solicitudes.</p></div><a class="btn" href="#/proveedores/nuevo">Añadir proveedor</a></div><div class="card"><div class="row"><div><h3>Google AI Studio</h3><p>1 conexión · 2 API keys · 3 modelos</p></div><a class="btn light" href="#/proveedores/demo/resumen">Abrir</a></div><div class="row"><div><h3>OpenRouter</h3><p>1 conexión · 1 API key · 8 modelos</p></div><a class="btn light" href="#/proveedores/demo/resumen">Abrir ejemplo</a></div></div>`,
  'proveedores/nuevo':`<div class="crumb"><a href="#/proveedores">Proveedores</a> / Añadir</div><div class="head"><div><h1>Añadir proveedor</h1><p>Solo necesitas identificarlo. Luego configurarás conexiones, claves y modelos desde su página.</p></div></div><div class="card"><form class="form" id="new-provider"><label>Identificador técnico <input name="id" required pattern="[a-z][a-z0-9-]*" placeholder="google"></label><label>Nombre visible (opcional) <input name="name" placeholder="Google AI Studio"></label><div class="actions"><a class="btn light" href="#/proveedores">Cancelar</a><button class="btn">Continuar</button></div></form></div>`,
  modelos:`<div class="head"><div><h1>Modelos</h1><p>Catálogo de modelos configurados en todos tus proveedores.</p></div></div><div class="filter"><button class="active">Todos</button><button>Proveedor</button><button>Capacidades</button><button>Precio configurado</button></div><div class="card"><div class="row"><div><h3>Gemini Flash</h3><p>Google AI Studio · Texto · Streaming</p></div><a href="#/modelos/demo">Ver ficha</a></div><div class="row"><div><h3>Modelo gratuito A</h3><p>OpenRouter · Texto · Herramientas</p></div><a href="#/modelos/demo">Ver ejemplo</a></div></div><p class="note">Filtro de contexto: se incorporaría solo cuando exista ese dato en el contrato y en los modelos registrados.</p>`,
  'modelos/demo':`<div class="crumb"><a href="#/modelos">Modelos</a> / Gemini Flash</div><div class="head"><div><h1>Gemini Flash</h1><p>Google AI Studio · gemini-flash</p></div><a class="btn light" href="#/proveedores/demo/modelos">Ver dentro del proveedor</a></div><div class="grid"><article class="card"><h2>Capacidades</h2><p>Texto · Streaming</p></article><article class="card"><h2>Precio configurado</h2><p>Desconocido</p></article><article class="card"><h2>API keys compatibles</h2><p>2 vinculadas</p></article></div><div class="grid two section"><article class="card"><h2>Uso y rendimiento</h2><div class="placeholder">Gráficos de tokens, latencia y errores observados</div></article><article class="card"><h2>Estado</h2><p>Los datos medidos no son pruebas independientes de uptime.</p></article></div>`,
  rutas:`<div class="head"><div><h1>Rutas</h1><p>Decide qué modelos se prueban y en qué orden.</p></div><a class="btn" href="#/rutas/nueva">Crear ruta</a></div><div class="card"><div class="row"><div><h3>assistant</h3><p>2 opciones · versión publicada</p></div><a href="#/rutas/demo">Abrir ruta</a></div></div>`,
  'rutas/nueva':`<div class="crumb"><a href="#/rutas">Rutas</a> / Nueva</div><h1>Crear ruta</h1><p>Wireframe del editor propuesto; el flujo completo todavía requiere implementación.</p><div class="card section"><div class="form"><label>Nombre o alias para tus aplicaciones <input placeholder="assistant"></label></div><h2 class="section">Recorrido</h2><div class="placeholder">[Añadir primera opción: proveedor → modelo → API key] → [Añadir fallback]</div><div class="actions section"><button class="btn light">Guardar borrador</button><button class="btn">Revisar y publicar</button></div></div>`,
  'rutas/demo':`<div class="crumb"><a href="#/rutas">Rutas</a> / assistant</div><div class="head"><div><h1>assistant</h1><p>Alias que utilizan tus aplicaciones.</p></div><span class="tag">Versión publicada</span></div><div class="card"><h2>Recorrido de respaldo</h2><div class="stack"><div class="route-step"><span class="number">1</span><div><strong>Gemini Flash</strong><p>Google AI Studio · clave principal</p></div></div><div class="route-step"><span class="number">2</span><div><strong>Modelo gratuito A</strong><p>OpenRouter · clave secundaria</p></div></div></div><div class="actions section"><button class="btn light">Editar recorrido</button><button class="btn">Revisar borrador</button></div><div class="note">Guardar y publicar son acciones diferentes. El tráfico sigue usando la versión publicada.</div></div>`,
  aplicaciones:`<h1>Aplicaciones</h1><p>¿Quién puede llamar a ModelCairn? Estos tokens son de entrada, no son claves de Google u OpenRouter.</p><div class="card section"><div class="head"><h2>Aplicaciones conectadas</h2><button class="btn">Crear acceso</button></div><div class="row"><div><strong>Hermes Agent</strong><p>Token activo · usa el alias assistant</p></div><button class="btn light">Gestionar</button></div></div>`,
  actividad:`<h1>Actividad</h1><p>Registro de solicitudes e intentos para investigar qué ocurrió.</p><div class="card section"><div class="filter"><button class="active">Todas</button><button>Correctas</button><button>Errores</button><button>Filtrar por ruta</button><button>Fecha</button></div>${eventRows(5)}<p class="note">Al abrir una solicitud, su detalle debería mostrarse sin perder filtros ni posición.</p></div>`,
  datos:`<div class="head"><div><h1>Datos</h1><p>Uso y tendencias; importes siempre estimados, no facturación real.</p></div><button class="btn light">Periodo: últimos 30 días ▾</button></div><div class="tabs"><a href="#/datos/general" data-tab="general">Visión general</a><a href="#/datos/proveedores" data-tab="proveedores">Por proveedor</a><a href="#/datos/modelos" data-tab="modelos">Por modelo</a><a href="#/datos/rutas" data-tab="rutas">Por ruta</a></div><div class="grid"><article class="card"><h2>Tokens</h2><strong class="big">17,8 M</strong><p>Uso reportado</p></article><article class="card"><h2>Coste estimado</h2><strong class="big">US$ 0,00</strong><p>Solo modelos con tarifa configurada</p></article><article class="card"><h2>Disponibilidad observada</h2><strong class="big">96,4 %</strong><p>Solicitudes recientes; no equivale a uptime</p></article></div><div class="grid two section"><article class="card"><h2>Tendencia de uso</h2><div class="placeholder">Gráfico de tokens y coste estimado</div></article><article class="card"><h2 id="data-breakdown">Desglose</h2><div class="placeholder">Tabla y gráfico según la pestaña seleccionada</div></article></div><div class="note">Los detalles se abrirían aquí en panel o vista contextual, sin enviarte a otra sección para entender una métrica.</div>`,
  configuracion:`<h1>Configuración</h1><p>Preferencias e instalación de ModelCairn.</p><div class="grid two section"><article class="card"><h2>Apariencia</h2><p>Tema claro/oscuro y preferencias de visualización.</p></article><article class="card"><h2>Acceso y seguridad</h2><p>Contraseña de administración, sesiones y límites.</p></article><article class="card"><h2>Historial y retención</h2><p>Cuánto tiempo guardar actividad y métricas locales.</p></article><article class="card"><h2>Red e instalación</h2><p>Dirección de acceso, HTTPS y servicio.</p></article></div><details class="card section"><summary>Opciones avanzadas</summary><p>Configuración técnica para operadores expertos.</p></details>`
};
function eventRows(count){return Array.from({length:count},(_,i)=>`<div class="row"><div><strong>${i===1?'Error 429':'Solicitud correcta'}</strong><p>assistant · ${i+1} min atrás · ${i===1?'fallback aplicado':'Gemini Flash'}</p></div><span class="tag">${i===1?'Revisar':'200'}</span></div>`).join('')}
function provider(tab){const tabs=['resumen','conexiones','claves','modelos'];const labels=['Resumen','Conexiones','API keys','Modelos'];let body={
  resumen:`<div class="grid"><article class="card"><h2>Conexiones</h2><strong class="big">1</strong><p>Endpoint configurado</p></article><article class="card"><h2>API keys</h2><strong class="big">2</strong><p>Claves vinculadas</p></article><article class="card"><h2>Modelos</h2><strong class="big">3</strong><p>Disponibles en este proveedor</p></article></div><div class="grid two section"><article class="card"><h2>Uso de este proveedor</h2><div class="placeholder">Gráfico de solicitudes, tokens y errores</div></article><article class="card"><h2>Estado</h2><p>Las métricas observadas no sustituyen sondeos de uptime.</p></article></div>`,
  conexiones:`<div class="card"><div class="head"><div><h2>Endpoints</h2><p>Direcciones a las que ModelCairn envía las solicitudes.</p></div><button class="btn" data-panel="connection">Añadir conexión</button></div><div class="row"><div><strong>google-api</strong><p>https://generativelanguage.googleapis.com/v1beta/openai</p></div><button class="btn light" data-panel="connection">Editar</button></div></div>`,
  claves:`<div class="card"><div class="head"><div><h2>API keys del proveedor</h2><p>Se guardan cifradas en el nodo principal.</p></div><button class="btn" data-panel="key">Añadir API key</button></div><div class="row"><div><strong>Clave principal</strong><p>Activa · salida directa · valor oculto</p></div><button class="btn light" data-panel="key">Cambiar o gestionar</button></div><div class="row"><div><strong>Clave secundaria</strong><p>Activa · salida directa · valor oculto</p></div><button class="btn light" data-panel="key">Cambiar o gestionar</button></div></div>`,
  modelos:`<div class="card"><div class="head"><div><h2>Modelos de Google AI Studio</h2><p>El catálogo global reúne también otros proveedores.</p></div><button class="btn" data-panel="model">Añadir modelo</button></div><div class="row"><div><strong>Gemini Flash</strong><p>Texto · Streaming · 2 claves compatibles</p></div><a href="#/modelos/demo">Abrir ficha</a></div><div class="row"><div><strong>Gemini Pro</strong><p>Texto · 1 clave compatible</p></div><a href="#/modelos/demo">Abrir ejemplo</a></div><a href="#/modelos">Ver catálogo global →</a></div>`
};return `<div class="crumb"><a href="#/proveedores">Proveedores</a> / Google AI Studio</div><div class="head"><div><h1>Google AI Studio</h1><p>Identificador: google · Configura este proveedor sin salir de su contexto.</p></div><button class="btn light">Editar proveedor</button></div><div class="tabs">${tabs.map((t,i)=>`<a href="#/proveedores/demo/${t}" class="${tab===t?'active':''}">${labels[i]}</a>`).join('')}</div>${body[tab]||body.resumen}<div id="inline-panel"></div>`}
const panels={connection:'<h2>Conexión API</h2><p>Panel contextual: identificador, URL del endpoint, estado y acciones para guardar o cancelar.</p>',key:'<h2>Gestionar API key</h2><p>Panel contextual: introducir una clave nueva, vincular una guardada, cambiarla o desactivarla. El valor anterior nunca se revela.</p>',model:'<h2>Añadir modelo</h2><p>Panel contextual: ID del proveedor, conexión, capacidades y tarifa opcional.</p>'};
function render(){const path=(location.hash||'#/inicio').slice(2).split('/');const area=path[0]||'inicio';let key=path.join('/');let html=area==='proveedores'&&path[1]==='demo'?provider(path[2]||'resumen'):screens[key]||screens[area]||screens.inicio;document.querySelector('#content').innerHTML=html;document.querySelector('#location').textContent=area.charAt(0).toUpperCase()+area.slice(1);document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav===area));document.querySelectorAll('[data-tab]').forEach(a=>a.classList.toggle('active',a.dataset.tab===(path[1]||'general')));const form=document.querySelector('#new-provider');if(form)form.addEventListener('submit',e=>{e.preventDefault();location.hash='#/proveedores/demo/resumen'});document.querySelectorAll('[data-panel]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#inline-panel').innerHTML=`<div class="card section">${panels[button.dataset.panel]}<div class="actions section"><button class="btn light" id="close-panel">Cerrar</button></div></div>`;document.querySelector('#close-panel').onclick=()=>document.querySelector('#inline-panel').innerHTML=''}))}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
