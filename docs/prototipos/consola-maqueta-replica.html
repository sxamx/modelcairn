<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ModelCairn · réplica visual</title>
  <style>
    :root{--bg:#eceff1;--sf:#fff;--sf2:#f5f7f8;--line:#dde2e6;--ink:#17212b;--mut:#5d6b78;--accent:#22706a;--accent-soft:#dcefec;--ok:#2b7a3f;--ok-soft:#dff1e3;--warn:#9a5b0a;--warn-soft:#fbedd3;--error:#b3362d;--error-soft:#fbe1de;--shadow:0 1px 2px #17212b0f;font-family:Manrope,Inter,system-ui,sans-serif;color-scheme:light}
    :root[data-theme=dark]{--bg:#0f1418;--sf:#171e25;--sf2:#1d262e;--line:#28333d;--ink:#e8edf1;--mut:#93a1ae;--accent:#6cc4ba;--accent-soft:#1a3733;--ok:#7fcf93;--ok-soft:#173523;--warn:#e2a54b;--warn-soft:#38290f;--error:#f08a80;--error-soft:#3d1c19;--shadow:none;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}a{color:var(--accent);text-decoration:none}
    .app{--side:236px;display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s}.app.collapsed{--side:68px}
    aside{position:sticky;top:0;height:100vh;background:var(--sf);border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;overflow:hidden}.brand{height:48px;display:flex;align-items:center;gap:10px;padding:0 8px 10px;font-weight:700;font-size:16px;white-space:nowrap}.stones{width:28px;height:28px;display:grid;align-content:center;justify-items:center;gap:2px;flex:none}.stones i{display:block;height:6px;border-radius:99px;background:var(--accent)}.stones i:nth-child(1){width:10px}.stones i:nth-child(2){width:18px;opacity:.75}.stones i:nth-child(3){width:28px;opacity:.5}
    nav{display:grid;gap:4px}.nav-button{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:9px 12px;background:transparent;border:0;border-radius:9px;color:var(--mut);font-weight:500;text-align:left;white-space:nowrap}.nav-button:hover{background:var(--sf2);color:var(--ink)}.nav-button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}.icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.aside-foot{margin-top:auto;padding:10px 12px;color:var(--mut);font-size:12px}.collapsed .brand{justify-content:center;padding-left:0;padding-right:0}.collapsed .label,.collapsed .aside-foot{display:none}.collapsed .nav-button{justify-content:center;padding-left:0;padding-right:0}
    .wrap{min-width:0}.topbar{height:60px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.crumb{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-actions{display:flex;align-items:center;gap:12px}.icon-button{width:36px;height:36px;display:grid;place-items:center;background:var(--sf);border:1px solid var(--line);border-radius:9px;color:var(--mut)}.icon-button:hover{background:var(--sf2);color:var(--ink)}.avatar{width:36px;height:36px;border:0;border-radius:50%;background:var(--accent);color:white;font-weight:700}.profile{display:none;position:absolute;right:24px;top:56px;width:224px;background:var(--sf);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px #0003;padding:6px}.profile.open{display:block}.profile .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}.profile small{display:block;color:var(--mut)}.profile button{display:block;width:100%;padding:9px 12px;background:transparent;border:0;border-radius:8px;color:var(--ink);text-align:left}.profile button:hover{background:var(--sf2)}
    main{max-width:1120px;width:100%;margin:0 auto;padding:28px 24px 60px}.preview-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:22px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--mut);font-size:12px}.preview-banner strong{color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:24px;line-height:1.3;letter-spacing:-.02em}h2{font-size:16px}h3{font-size:14px}.sub{color:var(--mut);margin:4px 0 22px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}.card h3{margin-bottom:10px}.card + .card-block{margin-top:14px}.big{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.02em}.muted{color:var(--mut)}.small{font-size:12px}.card .small{margin-top:8px}
    .badge{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;background:var(--sf2);color:var(--mut);font-size:12px;font-weight:600;white-space:nowrap}.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.error{background:var(--error-soft);color:var(--error)}.badge.accent{background:var(--accent-soft);color:var(--accent)}.button{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:var(--sf);color:var(--ink);font-weight:600}.button:hover{background:var(--sf2)}.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.button.primary:hover{filter:brightness(1.08)}:root[data-theme=dark] .button.primary,:root[data-theme=dark] .avatar{color:#0f1418}
    .section{margin-top:14px}.section-head{margin-bottom:12px}.table-wrap{overflow:auto;padding:0}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{background:var(--sf2);color:var(--mut);font-size:12px;font-weight:600}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:var(--sf2)}.table .rowlink{font-weight:600;color:var(--ink)}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0;overflow:auto}.tabs button,.tabs a{display:inline-block;padding:10px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--mut);font-weight:600;white-space:nowrap}.tabs button.active,.tabs a.active{border-color:var(--accent);color:var(--accent)}
    .field{display:grid;gap:6px;max-width:420px;margin:12px 0}.field label{font-weight:600}.field input,.field select{min-height:36px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--sf);color:var(--ink)}.hint{background:var(--accent-soft);color:var(--accent);padding:12px 16px;border-radius:10px;margin:0 0 18px}.barrow{display:flex;align-items:center;gap:12px;margin:12px 0}.barrow span:first-child{width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bartrack{height:8px;flex:1;background:var(--sf2);border-radius:8px;overflow:hidden}.bartrack i{display:block;height:100%;background:var(--accent);border-radius:8px}.barrow b{width:50px;text-align:right}.spark{height:105px;display:flex;align-items:flex-end;gap:6px}.spark i{flex:1;background:var(--accent);opacity:.85;border-radius:4px 4px 0 0}
    .placeholder{padding:24px;color:var(--mut)}.placeholder h2{color:var(--ink);margin-bottom:12px}.placeholder p{line-height:1.6}.footer-note{margin-top:14px;color:var(--mut);font-size:12px}
    @media(max-width:760px){.app,.app.collapsed{display:block}aside{position:fixed;inset:auto 0 0;height:auto;z-index:9;display:block;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line);overflow-x:auto}.brand,.aside-foot,.label,.collapse-button{display:none}nav{display:flex;width:max-content}.nav-button,.collapsed .nav-button{justify-content:center;padding:10px 12px}.topbar{padding:0 16px}.profile{right:16px}main{padding:20px 16px 100px}.table{min-width:560px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside aria-label="Navegación principal"><div class="brand"><span class="stones" aria-hidden="true"><i></i><i></i><i></i></span><span class="label">ModelCairn</span></div><nav id="nav"></nav><div class="aside-foot">ModelCairn · Código abierto</div></aside>
    <div class="wrap"><header class="topbar"><button class="icon-button collapse-button" id="collapse" aria-label="Contraer menú"></button><strong class="crumb" id="crumb">Inicio</strong><div class="top-actions"><button class="icon-button" id="theme" aria-label="Activar modo oscuro"></button><button class="avatar" id="avatar" aria-label="Menú de usuario" aria-expanded="false">S</button></div><div class="profile" id="profile"><div class="who"><strong>Sam</strong><small>Administrador · ejemplo</small></div><button data-go="config">Configuración</button><button id="signout">Cerrar sesión</button></div></header><main><div class="preview-banner"><strong>MAQUETA INTERACTIVA</strong><span>Datos de ejemplo. No está conectada a tu VM ni modifica la configuración real.</span></div><div id="content"></div></main></div>
  </div>
  <script>
    const paths={
      home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/>',
      provider:'<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>',
      model:'<path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/>',
      route:'<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/>',
      play:'<path d="m6 4 14 8-14 8z"/>',
      key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/>',
      activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
      data:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
      settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
      panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
      moon:'<path d="M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z"/>',
      sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>'
    };
    const icon=name=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+paths[name]+'</svg>';
    const nav=[['inicio','Inicio','home'],['proveedores','Proveedores','provider'],['modelos','Modelos','model'],['rutas','Rutas','route'],['playground','Playground','play'],['acceso','Acceso API','key'],['actividad','Actividad','activity'],['datos','Datos','data'],['config','Configuración','settings']];
    const table=(heads,rows)=>'<div class="card table-wrap"><table class="table"><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    const metric=(name,value,extra)=>'<article class="card"><h3>'+name+'</h3><div class="big">'+value+'</div><p class="small muted">'+extra+'</p></article>';
    const badge=(text,tone)=>'<span class="badge '+tone+'">'+text+'</span>';
    const samples={
      inicio:()=>'<h1>Bienvenido, Sam</h1><p class="sub">Estado de tu gateway en un vistazo.</p><div class="hint">Nada urgente. Podés preparar proveedores y keys cuando quieras; las rutas vienen después.</div><div class="grid">'+
        '<article class="card"><h3>Gateway</h3>'+badge('Funcionando','ok')+'<p class="small muted">Activo desde hace 6 d 4 h</p></article>'+
        metric('Solicitudes hoy','1.284','de 1.311 intentos')+metric('Con fallback','37','2,9 % de las solicitudes')+metric('Gasto estimado del mes','US$ 18,42','Precios configurados por el usuario')+metric('Cooldowns activos','1','Google · key “personal”')+'</div>'+
        '<section class="section"><div class="row between section-head"><h2>Actividad reciente</h2><a href="#/actividad">Ver todo</a></div>'+table(['Hora','Ruta','Destino','Resultado'],[['12:41:07','chat-rapido','Groq / Llama 3.3',badge('200','ok')],['12:40:52','chat-rapido','Groq → Google',badge('429 → 200','warn')],['12:39:10','codigo','OpenRouter / Qwen',badge('200','ok')]])+'</section>',
      proveedores:()=>'<div class="row between"><h1>Proveedores</h1><button class="button primary" data-demo="Añadir proveedor">+ Añadir proveedor</button></div><p class="sub">Servicios de modelos a los que te conectás y las keys que guardaste.</p>'+table(['Proveedor','Estado','Keys','Modelos'],[
        ['<a class="rowlink" href="#/proveedores/openrouter">OpenRouter</a>',badge('Operativo','ok'),'2','14'],
        ['<a class="rowlink" href="#/proveedores/groq">Groq</a>',badge('Operativo','ok'),'1','6'],
        ['<a class="rowlink" href="#/proveedores/google">Google AI Studio</a>',badge('Con errores','warn'),'3','9'],
        ['<a class="rowlink" href="#/proveedores/mistral">Mistral</a>',badge('Sin configurar',''),'0','0']]),
      modelos:()=>'<h1>Modelos</h1><p class="sub">Catálogo de modelos disponibles en tus proveedores.</p><div class="tabs"><button class="active">Catálogo</button><button data-demo="Precios">Precios</button></div>'+table(['Modelo','Proveedor','Capacidades','Keys compatibles'],[['llama-3.3-70b','Groq','Herramientas · Streaming','1 key'],['gemini-2.5-flash','Google AI Studio','Herramientas · Streaming · Visión','2 de 3 keys'],['deepseek-v3','OpenRouter','Streaming','2 keys'],['qwen-2.5-coder-32b','OpenRouter','Herramientas · Streaming','1 de 2 keys']]),
      rutas:()=>'<div class="row between"><h1>Rutas</h1><button class="button primary" data-demo="Nueva ruta">+ Nueva ruta</button></div><p class="sub">Un alias estable para tus aplicaciones y un orden de respaldo entre modelos y keys.</p>'+table(['Alias','Recorrido','Estado','Resumen'],[['chat-rapido','Llama 3.3 → Gemini Flash',badge('Activa','ok'),'2 keys · 2 pasos'],['codigo','Qwen Coder → DeepSeek',badge('Activa','ok'),'2 keys · 2 pasos'],['borrador','—',badge('Borrador',''),'Sin keys asignadas']]),
      playground:()=>'<h1>Playground</h1><p class="sub">Aquí podrías probar una ruta desde la consola.</p><div class="card placeholder"><h2>Diseño pendiente de validar</h2><p>Esta réplica visual no simula respuestas de IA ni envía prompts.</p></div>',
      acceso:()=>'<h1>Acceso API</h1><p class="sub">Aplicaciones conectadas y rutas a las que pueden acceder.</p><div class="card section"><h3>URL de conexión</h3><p class="muted">https://gateway.tu-red.ts.net/v1 <span class="badge">Ejemplo</span></p></div><div class="section">'+table(['Aplicación','Rutas permitidas','Límite','Último uso'],[['Hermes','Todas','120 solicitudes/min','hace 2 min'],['Editor','codigo','60 solicitudes/min','hace 1 h'],['Script backup','borrador','60 solicitudes/min','Sin uso']])+'</div>',
      actividad:()=>'<h1>Actividad</h1><p class="sub">Solicitudes e intentos sin guardar el contenido de prompts ni respuestas.</p>'+table(['Hora','Ruta','Destino','Resultado','Tiempo'],[['12:41:07','chat-rapido','Groq / Llama 3.3',badge('200','ok'),'0,4 s'],['12:40:52','chat-rapido','Groq → Google',badge('429 → 200','warn'),'1,6 s'],['12:39:10','codigo','OpenRouter / Qwen',badge('200','ok'),'2,3 s'],['12:31:44','codigo','OpenRouter / DeepSeek',badge('502','error'),'8,0 s']]),
      datos:()=>'<h1>Datos</h1><p class="sub">Tendencias y comparaciones de toda la instalación.</p><div class="grid">'+metric('Solicitudes','1.284','↑ 8 % vs. ayer')+metric('Tasa de éxito','97,1 %','Solicitudes terminadas bien')+metric('Latencia mediana','1,1 s','p95: 4,2 s')+metric('Tokens procesados','412 k','318 k entrada · 94 k salida')+'</div><div class="grid section" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>Solicitudes por hora</h3><div class="spark">'+[12,18,9,7,5,8,20,34,52,61,58,66,72,64,55,60,70,78,66,50,38,30,22,16].map(x=>'<i style="height:'+x+'%"></i>').join('')+'</div><p class="small muted">Datos ilustrativos de la maqueta</p></div><div class="card"><h3>Errores por proveedor</h3>'+[['Google AI Studio','6,3 %',63],['OpenRouter','2,1 %',21],['Groq','0,6 %',6]].map(x=>'<div class="barrow"><span>'+x[0]+'</span><div class="bartrack"><i style="width:'+x[2]+'%"></i></div><b>'+x[1]+'</b></div>').join('')+'</div></div>',
      config:()=>'<h1>Configuración</h1><p class="sub">Ajustes del gateway explicados con claridad.</p><div class="tabs"><button class="active">General</button><button data-demo="Límites y presupuesto">Límites y presupuesto</button></div><div class="card"><div class="field"><label for="retention">Historial detallado</label><select id="retention"><option>30 días</option><option>Sin límite</option></select></div><div class="field"><label for="session">Cerrar sesión por inactividad</label><select id="session"><option>8 horas</option><option>24 horas</option></select></div><p class="footer-note">Estos controles son demostrativos; no guardan cambios.</p></div>'
    };
    let current='inicio';
    function render(){
      const parts=(location.hash||'#/inicio').slice(2).split('/');current=samples[parts[0]]?parts[0]:'inicio';
      document.getElementById('nav').innerHTML=nav.map(([key,label,shape])=>'<button class="nav-button '+(key===current?'active':'')+'" data-go="'+key+'" title="'+label+'" aria-current="'+(key===current?'page':'false')+'">'+icon(shape)+'<span class="label">'+label+'</span></button>').join('');
      document.getElementById('crumb').textContent=nav.find(x=>x[0]===current)[1];
      document.getElementById('content').innerHTML=parts[0]==='proveedores'&&parts[1]?provider(parts[1]):samples[current]();
      document.getElementById('profile').classList.remove('open');document.getElementById('avatar').setAttribute('aria-expanded','false');
    }
    function provider(id){
      const names={openrouter:'OpenRouter',groq:'Groq',google:'Google AI Studio',mistral:'Mistral'};
      const title=names[id]||'Proveedor';const tab=(location.hash.split('/')[3]||'resumen');
      const tabs=[['resumen','Resumen'],['modelos','Modelos'],['keys','API keys'],['config','Configuración']];
      let body='';
      if(tab==='resumen')body='<div class="grid">'+metric('Latencia mediana','1,8 s','Últimas 24 horas')+metric('Tasa de error','2,1 %','Intentos con error ÷ intentos totales')+'<div class="card"><h3>Uptime</h3><span class="muted">Sin datos</span><p class="small muted">Requiere comprobaciones periódicas</p></div>'+'<div class="card"><h3>Nodos de salida</h3><span class="muted">Aún no configurados</span></div></div>';
      if(tab==='modelos')body='<div class="row between section-head"><span class="muted">Modelos disponibles en este proveedor</span><button class="button" data-demo="Importar modelos">Importar desde la API</button></div>'+table(['Modelo','Capacidades','Keys'],[['deepseek-v3','Streaming','2 keys'],['qwen-2.5-coder-32b','Herramientas · Streaming','1 de 2 keys']]);
      if(tab==='keys')body='<div class="row between section-head"><span class="muted">Las keys heredan la configuración del proveedor</span><button class="button primary" data-demo="Añadir key">+ Añadir key</button></div>'+table(['Key','Estado','Modelos permitidos','Ajustes propios'],[['personal',badge('En cooldown','warn'),'6 de 9','—'],['pago-equipo',badge('Operativa','ok'),'9 de 9','Timeout 60 s']]);
      if(tab==='config')body='<div class="card"><div class="field"><label for="url">URL de la API</label><input id="url" value="https://api.example.com/v1"></div><div class="field"><label for="timeout">Timeout predeterminado</label><input id="timeout" value="30 s"></div><p class="footer-note">Las keys usan estos valores salvo que definas una excepción.</p></div>';
      return '<a class="button" href="#/proveedores">← Volver</a><div class="row between section"><h1>'+title+'</h1>'+badge(id==='google'?'Con errores':'Operativo',id==='google'?'warn':'ok')+'</div><div class="tabs">'+tabs.map(([key,label])=>'<a class="'+(tab===key?'active':'')+'" href="#/proveedores/'+id+'/'+key+'">'+label+'</a>').join('')+'</div>'+body;
    }
    document.addEventListener('click',event=>{
      const go=event.target.closest('[data-go]');if(go){location.hash='#/'+go.dataset.go;render()}
      const demo=event.target.closest('[data-demo]');if(demo)alert('Maqueta visual: “'+demo.dataset.demo+'” se conectará en la aplicación real.');
      if(event.target.closest('#signout'))alert('Maqueta visual: no hay ninguna sesión abierta.');
      if(!event.target.closest('#profile,#avatar')){document.getElementById('profile').classList.remove('open');document.getElementById('avatar').setAttribute('aria-expanded','false')}
    });
    document.getElementById('collapse').innerHTML=icon('panel');
    document.getElementById('collapse').addEventListener('click',()=>{const collapsed=document.getElementById('app').classList.toggle('collapsed');document.getElementById('collapse').setAttribute('aria-label',collapsed?'Expandir menú':'Contraer menú')});
    function themeIcon(){const dark=document.documentElement.dataset.theme==='dark';document.getElementById('theme').innerHTML=icon(dark?'sun':'moon');document.getElementById('theme').setAttribute('aria-label',dark?'Activar modo claro':'Activar modo oscuro')}
    document.getElementById('theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';themeIcon()});
    document.getElementById('avatar').addEventListener('click',()=>{const open=document.getElementById('profile').classList.toggle('open');document.getElementById('avatar').setAttribute('aria-expanded',String(open))});
    window.addEventListener('hashchange',render);themeIcon();render();
  </script>
</body>
</html>
